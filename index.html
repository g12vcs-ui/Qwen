<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelForge - Professional Image Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="logo">PixelForge</div>
            <div class="menu-bar">
                <button id="btn-new" title="New (Ctrl+N)">New</button>
                <button id="btn-open" title="Open (Ctrl+O)">Open</button>
                <input type="file" id="file-input" accept="image/*,.json" style="display:none">
                <button id="btn-save" title="Save Project (Ctrl+S)">Save</button>
                <button id="btn-export" title="Export Image">Export</button>
            </div>
            <div class="history-controls">
                <button id="btn-undo" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
                <button id="btn-redo" title="Redo (Ctrl+Y)" disabled>↷ Redo</button>
            </div>
            <div class="zoom-controls">
                <button id="btn-zoom-out" title="Zoom Out">−</button>
                <span id="zoom-display">100%</span>
                <button id="btn-zoom-in" title="Zoom In">+</button>
                <button id="btn-fit" title="Fit to Screen">Fit</button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Toolbar -->
            <aside class="toolbar">
                <button class="tool-btn active" data-tool="move" title="Move Tool (V)">
                    <svg viewBox="0 0 24 24"><path d="M12 2L9 9H2l5.5 4.5L5 21l7-6 7 6-2.5-7.5L22 9h-7z"/></svg>
                </button>
                <button class="tool-btn" data-tool="select" title="Select Tool (A)">
                    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 2"/></svg>
                </button>
                <button class="tool-btn" data-tool="text" title="Text Tool (T)">
                    <svg viewBox="0 0 24 24"><text x="50%" y="75%" text-anchor="middle" font-size="18" font-weight="bold" fill="currentColor">T</text></svg>
                </button>
                <button class="tool-btn" data-tool="shape" title="Shape Tool (U)">
                    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                </button>
                <button class="tool-btn" data-tool="brush" title="Brush Tool (B)">
                    <svg viewBox="0 0 24 24"><path d="M18 3c-2.5 0-4.5 1.5-5.5 3.5C11 8.5 9 11 7 11c-1.5 0-3-1-3-2.5S5 5 7 5c.5 0 1 .1 1.5.3L7 3C6.5 2.8 6 2.8 5.5 2.8 2.5 2.8 0 5.3 0 8.3S2.5 13.8 5.5 13.8c3.5 0 6-3.5 7.5-5.5.5-.7 1.2-1.3 2-1.3 1.5 0 2.5 1.2 2.5 2.8 0 2.5-2.5 5.5-5 8l-1 1v2.5h3v-1.5c3-3 6-6.5 6-10 0-3-2.5-5.8-5.5-5.8z"/></svg>
                </button>
                <button class="tool-btn" data-tool="eraser" title="Eraser Tool (E)">
                    <svg viewBox="0 0 24 24"><path d="M16 3l5 5-11 11H5V14L16 3zm-2 2L7 12v5h5l9-9-5-5z"/></svg>
                </button>
                <button class="tool-btn" data-tool="crop" title="Crop Tool (C)">
                    <svg viewBox="0 0 24 24"><path d="M17 15h2V7c0-1.1-.9-2-2-2H9v2h8v8zM7 17V9H5v8c0 1.1.9 2 2 2h8v-2H7z"/></svg>
                </button>
                <button class="tool-btn" data-tool="eyedropper" title="Eyedropper Tool (I)">
                    <svg viewBox="0 0 24 24"><path d="M19.36 2.72l1.42 1.42c.78.78.78 2.05 0 2.83L9.83 17.92 7.07 20.68l-2.83-2.83 2.76-2.76L17.95 4.14c.78-.78 2.05-.78 2.83 0zM5.21 20L2 22.21 1.79 22l3.22-3.22L5.21 20z"/></svg>
                </button>
                <button class="tool-btn" data-tool="hand" title="Hand Tool (H)">
                    <svg viewBox="0 0 24 24"><path d="M18 10h-1V6c0-1.1-.9-2-2-2s-2 .9-2 2v4h-1V5c0-1.1-.9-2-2-2s-2 .9-2 2v5H8V6c0-1.1-.9-2-2-2S4 4.9 4 6v8c0 3.31 2.69 6 6 6h6c2.21 0 4-1.79 4-4v-4c0-1.1-.9-2-2-2z"/></svg>
                </button>
                
                <div class="color-picker-container">
                    <label>Fill</label>
                    <input type="color" id="fill-color" value="#3b82f6">
                </div>
                <div class="color-picker-container">
                    <label>Stroke</label>
                    <input type="color" id="stroke-color" value="#1e40af">
                </div>
                <div class="slider-container">
                    <label>Brush Size: <span id="brush-size-value">10</span></label>
                    <input type="range" id="brush-size" min="1" max="100" value="10">
                </div>
                <div class="slider-container">
                    <label>Opacity: <span id="opacity-value">100</span>%</label>
                    <input type="range" id="opacity-slider" min="0" max="100" value="100">
                </div>
            </aside>

            <!-- Center Canvas Area -->
            <main class="canvas-area">
                <div class="canvas-container" id="canvas-container">
                    <canvas id="main-canvas"></canvas>
                    <div class="transform-box" id="transform-box" style="display:none;">
                        <div class="handle nw" data-handle="nw"></div>
                        <div class="handle n" data-handle="n"></div>
                        <div class="handle ne" data-handle="ne"></div>
                        <div class="handle e" data-handle="e"></div>
                        <div class="handle se" data-handle="se"></div>
                        <div class="handle s" data-handle="s"></div>
                        <div class="handle sw" data-handle="sw"></div>
                        <div class="handle w" data-handle="w"></div>
                        <div class="rotate-handle" data-handle="rotate"></div>
                    </div>
                </div>
            </main>

            <!-- Right Panel -->
            <aside class="right-panel">
                <!-- Properties Panel -->
                <div class="panel properties-panel">
                    <div class="panel-header">Properties</div>
                    <div class="panel-content" id="properties-content">
                        <p class="no-selection">No layer selected</p>
                    </div>
                </div>

                <!-- Adjustments Panel -->
                <div class="panel adjustments-panel">
                    <div class="panel-header">Adjustments</div>
                    <div class="panel-content">
                        <div class="adjustment-control">
                            <label>Brightness</label>
                            <input type="range" id="adj-brightness" min="-100" max="100" value="0">
                            <span class="value-display" id="val-brightness">0</span>
                        </div>
                        <div class="adjustment-control">
                            <label>Contrast</label>
                            <input type="range" id="adj-contrast" min="-100" max="100" value="0">
                            <span class="value-display" id="val-contrast">0</span>
                        </div>
                        <div class="adjustment-control">
                            <label>Saturation</label>
                            <input type="range" id="adj-saturation" min="-100" max="100" value="0">
                            <span class="value-display" id="val-saturation">0</span>
                        </div>
                        <div class="adjustment-control">
                            <label>Hue Rotate</label>
                            <input type="range" id="adj-hue" min="-180" max="180" value="0">
                            <span class="value-display" id="val-hue">0°</span>
                        </div>
                        <div class="adjustment-control">
                            <label>Blur</label>
                            <input type="range" id="adj-blur" min="0" max="20" value="0">
                            <span class="value-display" id="val-blur">0px</span>
                        </div>
                        <button id="btn-reset-adjustments">Reset All</button>
                    </div>
                </div>

                <!-- Layers Panel -->
                <div class="panel layers-panel">
                    <div class="panel-header">
                        <span>Layers</span>
                        <div class="layer-controls">
                            <button id="btn-add-layer" title="Add Layer">+</button>
                            <button id="btn-delete-layer" title="Delete Layer">🗑</button>
                            <button id="btn-duplicate-layer" title="Duplicate Layer">⧉</button>
                        </div>
                    </div>
                    <div class="panel-content">
                        <div class="layers-list" id="layers-list"></div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- New Document Dialog -->
    <dialog id="new-doc-dialog">
        <form method="dialog">
            <h3>New Document</h3>
            <div class="form-group">
                <label>Width (px)</label>
                <input type="number" id="new-width" value="1920" min="1" max="8192">
            </div>
            <div class="form-group">
                <label>Height (px)</label>
                <input type="number" id="new-height" value="1080" min="1" max="8192">
            </div>
            <div class="form-group">
                <label>Background</label>
                <select id="new-bg">
                    <option value="transparent">Transparent</option>
                    <option value="white" selected>White</option>
                    <option value="black">Black</option>
                </select>
            </div>
            <div class="dialog-buttons">
                <button type="button" id="cancel-new">Cancel</button>
                <button type="submit" id="confirm-new">Create</button>
            </div>
        </form>
    </dialog>

    <!-- Export Dialog -->
    <dialog id="export-dialog">
        <form method="dialog">
            <h3>Export Image</h3>
            <div class="form-group">
                <label>Format</label>
                <select id="export-format">
                    <option value="png">PNG</option>
                    <option value="jpeg">JPEG</option>
                    <option value="webp">WEBP</option>
                </select>
            </div>
            <div class="form-group">
                <label>Quality (1-100)</label>
                <input type="number" id="export-quality" value="92" min="1" max="100">
            </div>
            <div class="form-group">
                <label>Scale</label>
                <select id="export-scale">
                    <option value="1">1x (Original)</option>
                    <option value="2">2x</option>
                    <option value="0.5">0.5x</option>
                </select>
            </div>
            <div class="dialog-buttons">
                <button type="button" id="cancel-export">Cancel</button>
                <button type="submit" id="confirm-export">Export</button>
            </div>
        </form>
    </dialog>

    <script src="src/utils/helpers.js"></script>
    <script src="src/models/Layer.js"></script>
    <script src="src/state/State.js"></script>
    <script src="src/history/History.js"></script>
    <script src="src/tools/BaseTool.js"></script>
    <script src="src/tools/MoveTool.js"></script>
    <script src="src/tools/SelectTool.js"></script>
    <script src="src/tools/TextTool.js"></script>
    <script src="src/tools/ShapeTool.js"></script>
    <script src="src/tools/BrushTool.js"></script>
    <script src="src/tools/EraserTool.js"></script>
    <script src="src/tools/CropTool.js"></script>
    <script src="src/tools/EyedropperTool.js"></script>
    <script src="src/tools/HandTool.js"></script>
    <script src="src/canvas/Renderer.js"></script>
    <script src="src/canvas/CanvasManager.js"></script>
    <script src="src/ui/UIManager.js"></script>
    <script src="src/export/Exporter.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
