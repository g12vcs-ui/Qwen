<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelForge - Professional Image Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="top-bar-left">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect x="2" y="2" width="9" height="9" rx="1" fill="#6366f1"/>
                        <rect x="13" y="2" width="9" height="9" rx="1" fill="#8b5cf6"/>
                        <rect x="2" y="13" width="9" height="9" rx="1" fill="#8b5cf6"/>
                        <rect x="13" y="13" width="9" height="9" rx="1" fill="#6366f1"/>
                    </svg>
                    <span>PixelForge</span>
                </div>
                <nav class="menu-bar">
                    <div class="menu-item" data-action="file">File</div>
                    <div class="menu-item" data-action="edit">Edit</div>
                    <div class="menu-item" data-action="view">View</div>
                    <div class="menu-item" data-action="layer">Layer</div>
                    <div class="menu-item" data-action="help">Help</div>
                </nav>
            </div>
            <div class="top-bar-center">
                <button class="icon-btn" data-action="undo" title="Undo (Ctrl+Z)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 10h10a5 5 0 0 1 5 5v5M3 10l6-6M3 10l6 6"/>
                    </svg>
                </button>
                <button class="icon-btn" data-action="redo" title="Redo (Ctrl+Shift+Z)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10H11a5 5 0 0 0-5 5v5M21 10l-6-6M21 10l-6 6"/>
                    </svg>
                </button>
                <div class="separator"></div>
                <span class="zoom-display" id="zoomDisplay">100%</span>
                <button class="icon-btn" data-action="zoom-out" title="Zoom Out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>
                    </svg>
                </button>
                <button class="icon-btn" data-action="zoom-in" title="Zoom In">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
                    </svg>
                </button>
                <button class="icon-btn" data-action="zoom-fit" title="Fit to Screen">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                    </svg>
                </button>
            </div>
            <div class="top-bar-right">
                <button class="btn btn-primary" data-action="export">Export</button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Toolbar -->
            <aside class="toolbar">
                <button class="tool-btn active" data-tool="move" title="Move (V)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2v20M2 12h20M7 7l5-5 5 5M7 17l5 5 5-5"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="select" title="Select (A)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
                    </svg>
                </button>
                <div class="separator"></div>
                <button class="tool-btn" data-tool="text" title="Text (T)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 7V4h16v3M9 20h6M12 4v16"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="shape" title="Shape (U)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="brush" title="Brush (B)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 13.5c0 1.5-1 2.5-2.5 2.5S13 15 13 13.5V9c0-1.5 1-2.5 2.5-2.5S18 7.5 18 9v4.5zM6 17l4-4"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L13.2 3c.8-.8 2-.8 2.8 0l6 6c.8.8.8 2 0 2.8L12 22"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="crop" title="Crop (C)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"/>
                    </svg>
                </button>
                <div class="separator"></div>
                <button class="tool-btn" data-tool="eyedropper" title="Eyedropper (I)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M2 22l5-5M15 7l5 5-9 9-5-5 9-9zM14 6l4-4"/>
                    </svg>
                </button>
                <button class="tool-btn" data-tool="hand" title="Hand (H)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
                        <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.9a2 2 0 0 1 3-2.6L7 16"/>
                    </svg>
                </button>
            </aside>

            <!-- Center Canvas Area -->
            <main class="canvas-area">
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="mainCanvas"></canvas>
                    <div class="canvas-overlay" id="canvasOverlay"></div>
                    <div class="transform-controls" id="transformControls" style="display: none;">
                        <div class="handle" data-handle="nw"></div>
                        <div class="handle" data-handle="n"></div>
                        <div class="handle" data-handle="ne"></div>
                        <div class="handle" data-handle="e"></div>
                        <div class="handle" data-handle="se"></div>
                        <div class="handle" data-handle="s"></div>
                        <div class="handle" data-handle="sw"></div>
                        <div class="handle" data-handle="w"></div>
                        <div class="rotate-handle" data-handle="rotate"></div>
                    </div>
                </div>
            </main>

            <!-- Right Panel -->
            <aside class="right-panel">
                <!-- Properties Panel -->
                <div class="panel properties-panel" id="propertiesPanel">
                    <div class="panel-header">
                        <span class="panel-title">Properties</span>
                    </div>
                    <div class="panel-content" id="propertiesContent">
                        <!-- Dynamic properties will be injected here -->
                    </div>
                </div>

                <!-- Adjustments Panel -->
                <div class="panel adjustments-panel">
                    <div class="panel-header">
                        <span class="panel-title">Adjustments</span>
                    </div>
                    <div class="panel-content">
                        <div class="adjustment-group">
                            <label class="slider-label">
                                <span>Brightness</span>
                                <span class="slider-value" id="brightnessValue">100%</span>
                            </label>
                            <input type="range" class="slider" id="brightness" min="0" max="200" value="100">
                        </div>
                        <div class="adjustment-group">
                            <label class="slider-label">
                                <span>Contrast</span>
                                <span class="slider-value" id="contrastValue">100%</span>
                            </label>
                            <input type="range" class="slider" id="contrast" min="0" max="200" value="100">
                        </div>
                        <div class="adjustment-group">
                            <label class="slider-label">
                                <span>Saturation</span>
                                <span class="slider-value" id="saturationValue">100%</span>
                            </label>
                            <input type="range" class="slider" id="saturation" min="0" max="200" value="100">
                        </div>
                        <div class="adjustment-group">
                            <label class="slider-label">
                                <span>Hue</span>
                                <span class="slider-value" id="hueValue">0°</span>
                            </label>
                            <input type="range" class="slider" id="hue" min="-180" max="180" value="0">
                        </div>
                        <div class="adjustment-group">
                            <label class="slider-label">
                                <span>Blur</span>
                                <span class="slider-value" id="blurValue">0px</span>
                            </label>
                            <input type="range" class="slider" id="blur" min="0" max="50" value="0">
                        </div>
                        <div class="adjustment-actions">
                            <button class="btn btn-secondary" data-action="reset-adjustments">Reset</button>
                        </div>
                    </div>
                </div>

                <!-- Layers Panel -->
                <div class="panel layers-panel" id="layersPanel">
                    <div class="panel-header">
                        <span class="panel-title">Layers</span>
                        <div class="panel-actions">
                            <button class="icon-btn-sm" data-action="add-layer" title="Add Layer">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                                </svg>
                            </button>
                            <button class="icon-btn-sm" data-action="add-folder" title="Add Folder">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                                </svg>
                            </button>
                            <button class="icon-btn-sm" data-action="delete-layer" title="Delete Layer">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="panel-content layers-content" id="layersContent">
                        <!-- Layers will be dynamically rendered here -->
                    </div>
                </div>
            </aside>
        </div>

        <!-- File Menu Dropdown -->
        <div class="dropdown-menu" id="fileMenu">
            <div class="dropdown-item" data-action="new-project">
                <span>New Project</span>
                <span class="shortcut">Ctrl+N</span>
            </div>
            <div class="dropdown-item" data-action="open-file">
                <span>Open...</span>
                <span class="shortcut">Ctrl+O</span>
            </div>
            <div class="dropdown-item" data-action="save-project">
                <span>Save Project</span>
                <span class="shortcut">Ctrl+S</span>
            </div>
            <div class="dropdown-item" data-action="load-project">
                <span>Load Project...</span>
            </div>
            <div class="dropdown-separator"></div>
            <div class="dropdown-item" data-action="import-image">
                <span>Import Image...</span>
            </div>
            <div class="dropdown-separator"></div>
            <div class="dropdown-item" data-action="export-png">
                <span>Export as PNG</span>
            </div>
            <div class="dropdown-item" data-action="export-jpg">
                <span>Export as JPG</span>
            </div>
            <div class="dropdown-item" data-action="export-webp">
                <span>Export as WEBP</span>
            </div>
        </div>

        <!-- Hidden file inputs -->
        <input type="file" id="fileInput" accept="image/*,.json" multiple style="display: none;">
        <input type="file" id="projectInput" accept=".json" style="display: none;">
    </div>

    <!-- New Project Dialog -->
    <dialog class="dialog" id="newProjectDialog">
        <div class="dialog-content">
            <h2>New Project</h2>
            <div class="form-group">
                <label for="canvasWidth">Width (px)</label>
                <input type="number" id="canvasWidth" value="1920" min="1" max="10000">
            </div>
            <div class="form-group">
                <label for="canvasHeight">Height (px)</label>
                <input type="number" id="canvasHeight" value="1080" min="1" max="10000">
            </div>
            <div class="form-group">
                <label for="backgroundColor">Background Color</label>
                <input type="color" id="backgroundColor" value="#ffffff">
            </div>
            <div class="preset-presets">
                <button class="preset-btn" data-width="1920" data-height="1080">1920×1080</button>
                <button class="preset-btn" data-width="1080" data-height="1080">1080×1080</button>
                <button class="preset-btn" data-width="800" data-height="600">800×600</button>
                <button class="preset-btn" data-width="1200" data-height="630">1200×630</button>
            </div>
            <div class="dialog-actions">
                <button class="btn btn-secondary" data-action="cancel-dialog">Cancel</button>
                <button class="btn btn-primary" data-action="create-project">Create</button>
            </div>
        </div>
    </dialog>

    <!-- Export Dialog -->
    <dialog class="dialog" id="exportDialog">
        <div class="dialog-content">
            <h2>Export Image</h2>
            <div class="form-group">
                <label for="exportFormat">Format</label>
                <select id="exportFormat">
                    <option value="png">PNG</option>
                    <option value="jpeg">JPEG</option>
                    <option value="webp">WEBP</option>
                </select>
            </div>
            <div class="form-group" id="qualityGroup" style="display: none;">
                <label for="exportQuality">Quality (%)</label>
                <input type="range" id="exportQuality" class="slider" min="1" max="100" value="90">
                <span id="qualityValue">90%</span>
            </div>
            <div class="form-group">
                <label for="exportScale">Scale</label>
                <select id="exportScale">
                    <option value="1">1x (Original)</option>
                    <option value="2">2x</option>
                    <option value="0.5">0.5x</option>
                </select>
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="transparentBg" checked>
                    <span>Transparent Background</span>
                </label>
            </div>
            <div class="dialog-actions">
                <button class="btn btn-secondary" data-action="cancel-dialog">Cancel</button>
                <button class="btn btn-primary" data-action="confirm-export">Export</button>
            </div>
        </div>
    </dialog>

    <script src="src/models/Layer.js"></script>
    <script src="src/state/State.js"></script>
    <script src="src/history/History.js"></script>
    <script src="src/utils/helpers.js"></script>
    <script src="src/canvas/Renderer.js"></script>
    <script src="src/tools/BaseTool.js"></script>
    <script src="src/tools/MoveTool.js"></script>
    <script src="src/tools/SelectTool.js"></script>
    <script src="src/tools/TextTool.js"></script>
    <script src="src/tools/ShapeTool.js"></script>
    <script src="src/tools/BrushTool.js"></script>
    <script src="src/tools/EraserTool.js"></script>
    <script src="src/tools/CropTool.js"></script>
    <script src="src/tools/EyedropperTool.js"></script>
    <script src="src/tools/HandTool.js"></script>
    <script src="src/export/Exporter.js"></script>
    <script src="src/ui/UIManager.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
